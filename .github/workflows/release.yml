name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6-Essentials>=6.6" requests pyinstaller
          pip install -e . --no-deps

      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name SubDrop `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --paths src `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module tkinter `
            --exclude-module pytest `
            scripts/launcher.py

      - name: Package
        run: Compress-Archive -Path dist/SubDrop/* -DestinationPath SubDrop-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubDrop-windows-x64
          path: SubDrop-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SubDrop-windows-x64.zip
          generate_release_notes: true
